name: Update and publish market dashboard
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-public-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify GPU price parsing and history retention
        run: |
          node scripts/check-gpu-quotes.mjs
          node scripts/check-nebius-spot.mjs
      - name: Collect official disclosures and market data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/refresh-public.mjs
      - name: Preserve accumulated history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/public/data/market.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market history [skip ci]"
            git push
          fi
      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Deploy standalone public website
        id: deploy
        uses: actions/deploy-pages@v4
